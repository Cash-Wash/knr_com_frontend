<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Agent OBS — Paramètres</title>
<style>
  :root {
    --brand: #38bdf8;
    --brand-dark: #0ea5e9;
    --brand-light: #f0f9ff;
    --ink: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    background: #f8fafc;
    color: var(--ink);
    padding: 20px;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--brand-light);
    border: 1px solid #bae6fd;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand-dark);
    margin-bottom: 16px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #94a3b8;
    flex-shrink: 0;
  }
  .dot.on { background: var(--brand); }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 13px;
    outline: none;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-light); }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 13px;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--brand-dark);
    color: white;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  .log {
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
  }
  .saved {
    margin-top: 8px;
    font-size: 12px;
    color: var(--brand-dark);
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Agent OBS</h1>
  <p class="subtitle">Relie ce PC de diffusion au site.</p>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Statut inconnu</span>
  </div>

  <label for="backendUrl">URL du site</label>
  <input id="backendUrl" type="text" placeholder="https://votre-site.bj" />

  <label for="token">Token Agent OBS</label>
  <input id="token" type="password" placeholder="Copié depuis Paramètres → Diffusion" />

  <div class="checkbox-row">
    <input id="launchAtStartup" type="checkbox" checked />
    <label for="launchAtStartup" style="margin:0; text-transform:none; font-weight:500; letter-spacing:normal; color:var(--ink);">
      Lancer au démarrage de Windows
    </label>
  </div>

  <button id="save">Enregistrer et se connecter</button>
  <p class="saved" id="saved" style="display:none;">Enregistré.</p>
  <p class="log" id="log"></p>

  <script src="settings.js"></script>
</body>
</html>
